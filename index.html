<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact → WhatsApp</title>
  <style>
    body          { font-family: system-ui, sans-serif; background:#f5f7fa; }
    #contactForm  { max-width:480px; margin:60px auto; padding:24px;
                    background:#fff; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08);}
    .form-group   { margin-bottom:16px; }
    label         { display:block; font-weight:600; margin-bottom:6px; }
    input,textarea{ width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; }
    textarea      { height:96px; resize:vertical; }
    button        { background:#1175f8; color:#fff; border:0; padding:10px 18px;
                    border-radius:4px; cursor:pointer; font-size:15px; }
    button:disabled{ opacity:.6; cursor:not-allowed; }
    #result       { margin-top:16px; padding:10px; border-radius:4px; }
    .success      { background:#dff0d8; color:#356e36; }
    .error        { background:#fcebea; color:#b92c2c; }
  </style>
</head>

<body>
<form id="contactForm">
  <div class="form-group">
    <label for="name">Name</label>
    <input id="name" name="name" required />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>
  </div>

  <button id="submitBtn" type="submit">Send</button>
  <p id="result"></p>
</form>

<script>
const form       = document.getElementById("contactForm");
const submitBtn  = document.getElementById("submitBtn");
const resultBox  = document.getElementById("result");

//  ✉️  POST → /send-whatsapp  (relative in dev; swap absolute URL when deployed)
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const data   = Object.fromEntries(new FormData(form).entries());
  const body   = { ...data, message: data.message.trim() };

  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";
  resultBox.textContent = "";

  try {
    const res   = await fetch("/send-whatsapp", {
      method : "POST",
      headers: { "Content-Type": "application/json" },
      body   : JSON.stringify(body)
    });
    const json  = await res.json();
    if (!res.ok) throw new Error(json.message || "Server error");

    resultBox.textContent = "✅ Message delivered to WhatsApp!";
    resultBox.className   = "success";
    form.reset();
  } catch (err) {
    resultBox.textContent = "❌ " + err.message;
    resultBox.className   = "error";
  } finally {
    submitBtn.disabled  = false;
    submitBtn.textContent = "Send";
  }
});
</script>
</body>
</html>
